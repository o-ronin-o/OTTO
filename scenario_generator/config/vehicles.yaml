vehicles:
  sedan_a:
    name: "Generic Sedan A"
    message_set: sedan_class
    mass_kg: 1500
    max_brake_force_n: 8000
    max_engine_torque_nm: 250
    drag_coefficient: 0.30
    frontal_area_m2: 2.2
    rolling_resistance: 0.015
    # --- Drivetrain (new) ---
    gear_ratios: {1: 3.8, 2: 2.1, 3: 1.4, 4: 1.0, 5: 0.8}
    final_drive: 3.5
    wheel_radius_m: 0.31
    drivetrain_efficiency: 0.90
    idle_rpm: 800
    # --- Crankshaft dynamics (Step 2.6 / Phase A) ---
    moment_of_inertia_kg_m2: 0.20       # rotating assembly inertia
    engine_friction_coeff: 0.005        # Nm·s/rad, internal losses
    clutch_slip_drag_coeff: 0.02        # Nm·s/rad, torque on slipping clutch
    idle_throttle_pct: 5.0   
    redline_rpm: 6500                   # rev limiter threshold           # minimum throttle command at idle
    can_mapping:
      engine_rpm:
        id: 0x100
        start_byte: 0
        length: 2
        scale: 0.25
        offset: 0
      throttle_position:
        id: 0x100
        start_byte: 2
        length: 1
        scale: 1
        offset: 0
      coolant_temperature:
        id: 0x100
        start_byte: 3
        length: 1
        scale: 1
        offset: -40
      brake_pressure:
        id: 0x1A0
        start_byte: 0
        length: 2
        scale: 0.01
        offset: 0
      brake_pedal:
        id: 0x1A0
        start_byte: 2
        length: 1
        scale: 1
        offset: 0
      wheel_speed:
        id: 0x1A0
        start_byte: 3
        length: 2
        scale: 0.01
        offset: 0
      vehicle_speed:
        id: 0x120
        start_byte: 0
        length: 2
        scale: 0.01
        offset: 0
      longitudinal_acceleration:
        id: 0x120
        start_byte: 2
        length: 2
        scale: 0.01
        offset: -10
      crank_position:
        id: 0x100
        start_byte: 4
        length: 2
        scale: 0.1
        offset: 0

  suv_b:
    name: "Generic SUV B"
    message_set: suv_class
    mass_kg: 2200
    max_brake_force_n: 10000
    max_engine_torque_nm: 350
    drag_coefficient: 0.35
    frontal_area_m2: 2.8
    rolling_resistance: 0.018
    # --- Drivetrain (new) ---
    gear_ratios: {1: 4.2, 2: 2.4, 3: 1.5, 4: 1.0, 5: 0.75}
    final_drive: 3.7
    wheel_radius_m: 0.35
    drivetrain_efficiency: 0.90
    idle_rpm: 800
    # --- Crankshaft dynamics (Step 2.6 / Phase A) ---
    moment_of_inertia_kg_m2: 0.35        # rotating assembly inertia
    engine_friction_coeff: 0.005        # Nm·s/rad, internal losses
    clutch_slip_drag_coeff: 0.02        # Nm·s/rad, torque on slipping clutch
    idle_throttle_pct: 5.0              # minimum throttle command at idle
    redline_rpm: 6500                   # rev limiter threshold
    can_mapping:
      engine_rpm:
        id: 0x200
        start_byte: 0
        length: 2
        scale: 0.25
        offset: 0
      throttle_position:
        id: 0x200
        start_byte: 2
        length: 1
        scale: 1
        offset: 0
      coolant_temperature:
        id: 0x200
        start_byte: 3
        length: 1
        scale: 1
        offset: -40
      brake_pressure:
        id: 0x2B0
        start_byte: 0
        length: 2
        scale: 0.01
        offset: 0
      brake_pedal:
        id: 0x2B0
        start_byte: 2
        length: 1
        scale: 1
        offset: 0
      wheel_speed:
        id: 0x2B0
        start_byte: 3
        length: 2
        scale: 0.01
        offset: 0
      vehicle_speed:
        id: 0x220
        start_byte: 0
        length: 2
        scale: 0.01
        offset: 0
      longitudinal_acceleration:
        id: 0x220
        start_byte: 2
        length: 2
        scale: 0.01
        offset: -10
      crank_position:
        id: 0x200
        start_byte: 4
        length: 2
        scale: 0.1
        offset: 0