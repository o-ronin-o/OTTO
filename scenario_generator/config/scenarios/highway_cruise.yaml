scenario:
  name: "Highway Cruise"
  duration_s: 90
  base_rate_hz: 100
  vehicle_id: suv_b
  segments:
    # Launch in 1st
    - {t_start: 0,  t_end: 3,  throttle_pct: 55, brake_pedal_pct: 0, gear: 1}
    # 2nd — brief shift
    - {t_start: 3,  t_end: 6,  throttle_pct: 55, brake_pedal_pct: 0, gear: 2}
    # 3rd — building speed
    - {t_start: 6,  t_end: 11, throttle_pct: 50, brake_pedal_pct: 0, gear: 3}
    # 4th — merging onto highway
    - {t_start: 11, t_end: 18, throttle_pct: 45, brake_pedal_pct: 0, gear: 4}
    # 5th — sustained cruise (higher throttle needed in overdrive)
    - {t_start: 18, t_end: 65, throttle_pct: 40, brake_pedal_pct: 0, gear: 5}
    # Exit ramp — downshift and brake
    - {t_start: 65, t_end: 72, throttle_pct: 0,  brake_pedal_pct: 15, gear: 4}
    - {t_start: 72, t_end: 82, throttle_pct: 0,  brake_pedal_pct: 25, gear: 3}
    - {t_start: 82, t_end: 90, throttle_pct: 0,  brake_pedal_pct: 40, gear: 1}